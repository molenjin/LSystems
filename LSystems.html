<head>
    <!-- Primary SEO Meta Tags -->
    <title>L-System Fractal Generator</title>
    <meta name="description" content="Generate and visualise beautiful 2D L-System fractals in your browser.">
    <meta name="keywords"
        content="L-system fractal generator, Lindenmayer systems, Miroslav Olenjin, procedural plant growth, turtle graphics simulator, context-free grammar fractals, Koch curve generator">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://molenjin.github.io/LSystems/">
    <!-- Open Graph / Facebook Meta Tags (For rich social sharing) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://molenjin.github.io/LSystems/">
    <meta property="og:title" content="Interactive L-System Fractal Generator">
    <meta property="og:description"
        content="Generate and visualise beautiful 2D L-System fractals. Customise rules to build procedural trees, plants, and mathematical fractals.">
    <meta property="og:image" content="https://github.io">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="LSystems.js" async></script>
    <script src="Examples.js" async></script>
</head>

<body>
    <div class="container">
        <div class="row mt-3">
            <div class="col">
                <strong>L-System Fractals</strong>
            </div>
            <div class="col text-end">
                by <a href="mailto:molenjin@gmail.com">M.Olenjin</a>
            </div>
        </div>
        <hr class="my-1">
        <div class="row">
            <div class="col-lg-3"></div>
            <div class="col-lg-6">
                <div class="ratio ratio-1x1">
                    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
            </div>
            <div class="col-lg-3"></div>
        </div>
        <div class="row gx-1 align-items-end">
            <div class="col-lg-4 d-flex">
                <div class="flex-grow-1">
                    <label for="examples">Examples:</label><select name="examples" class="form-select mb-1"
                        id="examples" holder=""></select>
                </div>
                <div class="ms-1">
                    </br><button type="button" class="btn btn-primary mb-1" style="touch-action: manipulation;" id="prevBtn">Prev</button>
                </div>
                <div class="ms-1">
                    </br><button type="button" class="btn btn-primary mb-1" style="touch-action: manipulation;" id="nextBtn">Next</button>
                </div>
            </div>
            <div class="col-lg-2">
                <label for="seed">Seed:</label><input id="seed" type="text" class="form-control mb-1" />
            </div>
            <div class="col-lg-2">
                <label for="rule">Rule:</label><input id="rule" type="text" class="form-control mb-1" />
            </div>
            <div class="col-lg-1">
                <label for="angle">Angle:</label><input id="angle" type="number" class="form-control mb-1" />
            </div>
            <div class="col-lg-1">
                <label for="startAngle">Start Angle:</label><input id="startAngle" type="number"
                    class="form-control mb-1" />
            </div>
            <div class="col-lg-1">
                <label for="generations">Generations:</label><input id="generations" type="number"
                    class="form-control mb-1" />
            </div>
            <div class="col-lg-1">
                </br><button type="button" class="btn btn-primary w-100 mb-1" id="runBtn" disabled>Run</button>
            </div>
        </div>
        <hr class="my-1">
        <div class="row text-end mb-3">
            <span>Source code: <a href="https://github.com/molenjin/LSystems">GitHub</a></span>
        </div>
    </div>
</body>

<script type="module">
    const examples = document.getElementById("examples");
    examplesJson.examples.forEach(example => {
        examples.add(new Option(example.name, JSON.stringify(example)));
    });

    const runBtn = document.getElementById("runBtn");

    examples.addEventListener("change", (event) => {
        const selected = JSON.parse(event.target.value);
        document.getElementById("seed").value = selected.seed;
        document.getElementById("rule").value = selected.rule;
        document.getElementById("angle").value = parseInt(selected.angle);
        document.getElementById("startAngle").value = parseInt(selected.startAngle);
        document.getElementById("generations").value = parseInt(selected.generations);

        runBtn.disabled = true;

        runSystem(selected.seed, selected.rule, selected.angle, selected.startAngle, selected.generations);
    });    

    document.querySelectorAll("input").forEach(input => input.addEventListener("input", () => {
        runBtn.disabled = false;
    }));

    document.getElementById("prevBtn").addEventListener("click", () => {
        examples.selectedIndex = (examples.selectedIndex - 1 + examples.options.length) % examples.options.length;
        examples.dispatchEvent(new Event('change'));
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
        examples.selectedIndex = (examples.selectedIndex + 1) % examples.options.length;;
        examples.dispatchEvent(new Event('change'));
    });

    document.getElementById("runBtn").addEventListener("click", () => {

        const allowedRegex = /^[F+\-\[\]]+$/;

        //-------------------------------------------------------------------

        const seed = document.getElementById("seed").value;
        if (seed === "") {
            alert("Seed cannot be empty.");
            return;
        }
        if (allowedRegex.test(seed) === false) {
            alert("Seed can only contain characters F, +, -, [, ].");
            return;
        }

        //-------------------------------------------------------------------

        const rule = document.getElementById("rule").value;
        if (rule === "") {
            alert("Rule cannot be empty.");
            return;
        }
        if (allowedRegex.test(rule) === false) {
            alert("Rule can only contain characters F, +, -, [, ].");
            return;
        }

        //-------------------------------------------------------------------

        const angle = parseFloat(document.getElementById("angle").value);
        if (isNaN(angle)) {
            alert("Angle must be a number.");
            return;
        }

        //-------------------------------------------------------------------

        const startAngle = parseFloat(document.getElementById("startAngle").value);
        if (isNaN(startAngle)) {
            alert("Start Angle must be a number.");
            return;
        }

        //-------------------------------------------------------------------

        const generations = parseInt(document.getElementById("generations").value);
        if (isNaN(generations)) {
            alert("Generations must be a number.");
            return;
        }
        if (generations === 0) {
            alert("Generations must not be zero.");
            return;
        }
        if (generations < 0) {
            alert("Generations must be a non-negative number.");
            return;
        }
        if (generations > 10) {
            alert("Generations must be less than or equal to 10.");
            return;
        }

        //-------------------------------------------------------------------

        runSystem(seed, rule, angle, startAngle, generations);
    });

    examples.dispatchEvent(new Event('change'));
</script>
